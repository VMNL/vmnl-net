name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-tag-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Check that the tag matches the project version
        run: |
          cmake --preset release
          grep -Fx "CMAKE_PROJECT_VERSION:STATIC=${GITHUB_REF_NAME#v}" build/release/CMakeCache.txt > /dev/null
        timeout-minutes: 5

  build:
    name: Build (${{ matrix.target.platform }}, ${{ matrix.type }})
    runs-on: ${{ matrix.target.os }}
    needs: check-tag-version
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: vmnl_net-${{ github.ref_name }}-${{ matrix.target.platform }}-${{ matrix.type }}
    strategy:
      matrix:
        target:
          - { platform: windows-x86_64, os: windows-latest }
          - { platform: windows-arm64, os: windows-11-arm }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: linux-x86_64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
        type: [static, shared]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Build the ${{ matrix.type }} library
        run: |
          cmake --preset release -DBUILD_SHARED_LIBS=${{ matrix.type == 'shared' }}
          cmake --build --preset release
        timeout-minutes: 30

      - name: Package the library
        run: |
          cmake --install build/release --config Release --prefix "$PACKAGE"
          cp LICENSE README.md "$PACKAGE"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
        timeout-minutes: 5

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error
        timeout-minutes: 10

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
        timeout-minutes: 5

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "vmnl_net $GITHUB_REF_NAME" --generate-notes
        timeout-minutes: 10
