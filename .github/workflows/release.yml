# Builds the release archives and publishes them on every v* tag.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target.platform }}, ${{ matrix.type }})
    runs-on: ${{ matrix.target.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: vmnl_net-${{ github.ref_name }}-${{ matrix.target.platform }}-${{ matrix.type }}
    strategy:
      matrix:
        target:
          - { platform: windows-x86_64, os: windows-latest }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: linux-x86_64, os: ubuntu-latest }
        type: [static, shared]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Build the ${{ matrix.type }} library
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.type == 'shared' }} -DVMNL_NET_BUILD_TESTS=OFF
          cmake --build build --config Release
        timeout-minutes: 30

      # The cache may have CRLF line endings on Windows.
      - name: Check that the tag matches the project version
        run: tr -d '\r' < build/CMakeCache.txt | grep -Fx "CMAKE_PROJECT_VERSION:STATIC=${GITHUB_REF_NAME#v}" > /dev/null
        timeout-minutes: 5

      - name: Package the library
        run: |
          cmake --install build --config Release --prefix "$PACKAGE"
          cp LICENSE README.md "$PACKAGE"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
        timeout-minutes: 5

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error
        timeout-minutes: 10

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
        timeout-minutes: 5

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "vmnl_net $GITHUB_REF_NAME" --generate-notes
        timeout-minutes: 10
