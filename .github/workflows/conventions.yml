# Checks the pull request title and every commit against the commit convention of VMNL.
name: Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commits:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    name: Commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 5

      - name: Fetch the commit convention checker of VMNL
        run: curl -fsSL -o "$RUNNER_TEMP/commit_message.py" https://raw.githubusercontent.com/VMNL/vmnl/main/tools/commit_message.py
        timeout-minutes: 5

      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title.txt"
          python3 "$RUNNER_TEMP/commit_message.py" file "$RUNNER_TEMP/title.txt"
        timeout-minutes: 5

      - name: Check every commit of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for commit in $(git rev-list --no-merges --reverse "$BASE..$HEAD"); do
            echo "Checking $(git log -1 --format='%h %s' "$commit")"
            git show --no-patch --format=%B "$commit" > "$RUNNER_TEMP/message.txt"
            python3 "$RUNNER_TEMP/commit_message.py" file "$RUNNER_TEMP/message.txt"
          done
        timeout-minutes: 5
