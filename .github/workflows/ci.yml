# Builds and tests the static and the shared library on Linux, macOS and Windows.
# Also checks that the sources follow .clang-format.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: 22.1.8

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Check the formatting
        run: find src include tests \( -name '*.[ch]' -o -name '*.cpp' \) -exec pipx run "clang-format==$CLANG_FORMAT_VERSION" --dry-run --Werror {} +
        timeout-minutes: 10

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.type }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        type: [static, shared]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.type == 'shared' }}
        timeout-minutes: 10

      - name: Build
        run: cmake --build build --config Debug
        timeout-minutes: 20

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
        timeout-minutes: 10

      - name: Install
        run: cmake --install build --config Debug --prefix install
        timeout-minutes: 5
