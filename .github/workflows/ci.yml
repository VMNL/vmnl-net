name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: 23.1.4
  CLANG_TIDY_VERSION: 23.1.4
  GCOVR_VERSION: 8.6
  VMNL_NET_WARNINGS_AS_ERRORS: ON

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pipx install "clang-format==$CLANG_FORMAT_VERSION"
        timeout-minutes: 5

      - name: Check the formatting
        run: cmake --workflow --preset format-check
        timeout-minutes: 10

  tidy:
    name: Tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install clang-tidy ${{ env.CLANG_TIDY_VERSION }}
        shell: bash
        run: |
          pipx install "clang-tidy==$CLANG_TIDY_VERSION"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" > nul && set" |
            Select-String -Pattern '^(PATH|INCLUDE|LIB|LIBPATH)=' |
            ForEach-Object { $_.Line } |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        timeout-minutes: 5

      - name: Check the library
        run: cmake --workflow --preset tidy
        timeout-minutes: 20

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Install gcovr ${{ env.GCOVR_VERSION }}
        run: pipx install "gcovr==$GCOVR_VERSION"
        timeout-minutes: 5

      - name: Measure the coverage
        run: cmake --workflow --preset coverage
        timeout-minutes: 30

      - name: Summarize the coverage
        if: ${{ !cancelled() }}
        run: cat build/coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 5

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage/report/html
        timeout-minutes: 5

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-26-intel, macos-latest, ubuntu-latest, ubuntu-26.04-arm]
        type: [static, shared]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Configure
        run: cmake --preset test -DBUILD_SHARED_LIBS=${{ matrix.type == 'shared' }}
        timeout-minutes: 10

      - name: Build
        run: cmake --build --preset test
        timeout-minutes: 20

      - name: Test
        run: ctest --preset test
        timeout-minutes: 10

      - name: Install
        run: cmake --install build/test --config Release --prefix install
        timeout-minutes: 5

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Build the benchmarks
        run: cmake --workflow --preset bench
        timeout-minutes: 30

      - name: Run each benchmark once
        run: |
          build/bench/bin/vmnl_net_benchmarks --benchmark_min_time=1x --benchmark_out=benchmarks.json
          jq -e 'all(.benchmarks[]; .error_occurred != true)' benchmarks.json
        timeout-minutes: 10

  sanitize:
    name: Sanitize (${{ matrix.sanitizers }})
    runs-on: ubuntu-latest
    env:
      CC: clang
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: sanitize-address
            sanitizers: address, undefined
          - preset: sanitize-memory
            sanitizers: memory
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Sanitize (${{ matrix.sanitizers }})
        run: cmake --workflow --preset ${{ matrix.preset }}
        timeout-minutes: 30
