# Builds and tests the static and the shared library in Release on Windows, macOS and Linux.
# Also checks that the sources follow .clang-format.
# Then runs the tests under AddressSanitizer and UBSan, and measures their coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: 22.1.8
  GCOVR_VERSION: 8.6

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pipx install "clang-format==$CLANG_FORMAT_VERSION"
        timeout-minutes: 5

      - name: Check the formatting
        run: cmake --workflow --preset format-check
        timeout-minutes: 10

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.type }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        type: [static, shared]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Configure
        run: cmake --preset test -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.type == 'shared' }}
        timeout-minutes: 10

      - name: Build
        run: cmake --build --preset test --config Release
        timeout-minutes: 20

      - name: Test
        run: ctest --preset test --build-config Release
        timeout-minutes: 10

      - name: Install
        run: cmake --install build/test --config Release --prefix install
        timeout-minutes: 5

  sanitize:
    name: Sanitize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Build and test
        run: cmake --workflow --preset sanitize
        timeout-minutes: 30

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Configure
        run: cmake --preset coverage
        timeout-minutes: 10

      - name: Build
        run: cmake --build --preset coverage
        timeout-minutes: 20

      - name: Test
        run: ctest --preset coverage
        timeout-minutes: 10

      - name: Measure the coverage
        run: pipx run "gcovr==$GCOVR_VERSION" --root . --filter src/ --markdown-summary "$GITHUB_STEP_SUMMARY" --html-details coverage/ --fail-under-line 100 --fail-under-branch 100 build/coverage
        timeout-minutes: 5

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
        timeout-minutes: 5
