name: Benchmarks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_BENCHMARKS: ../base/build/bench/bin/vmnl_net_benchmarks
  HEAD_BENCHMARKS: build/bench/bin/vmnl_net_benchmarks

jobs:
  times:
    name: Compare the times
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        timeout-minutes: 5

      - name: Build the benchmarks of the pull request and of its base
        run: |
          cmake --workflow --preset bench
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cd ../base && cmake --workflow --preset bench
        timeout-minutes: 30

      - name: Install the requirements of compare.py and gnuplot
        run: |
          python3 -m venv ./venv
          ./venv/bin/pip install -r build/bench/_deps/benchmark-src/tools/requirements.txt
          sudo apt-get update
          sudo apt-get install -y gnuplot-nox
        timeout-minutes: 10

      - name: Compare the times
        run: |
          mkdir -p report
          "$BASE_BENCHMARKS" --benchmark_repetitions=9 --benchmark_out=report/base.json --benchmark_out_format=json
          "$HEAD_BENCHMARKS" --benchmark_repetitions=9 --benchmark_out=report/head.json --benchmark_out_format=json
          ./venv/bin/python build/bench/_deps/benchmark-src/tools/compare.py --no-color -a benchmarks report/base.json report/head.json > report/times.txt
          { echo '```'; cat report/times.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 90

      - name: Write the report
        run: gnuplot -c bench/report.gp report/times.txt benchmarks-report.pdf
        timeout-minutes: 10

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: benchmarks-report.pdf
          archive: false
        timeout-minutes: 5
