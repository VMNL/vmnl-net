name: Benchmarks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'bench/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE: ${{ github.event.pull_request.base.sha }}
  BASE_BENCHMARKS: ../base/build/bench/bin/vmnl_net_benchmarks
  HEAD_BENCHMARKS: build/bench/bin/vmnl_net_benchmarks
  PARTS: 5

jobs:
  plan:
    name: Split the benchmarks
    runs-on: ubuntu-24.04
    outputs:
      filters: ${{ steps.split.outputs.filters }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5

      - name: Build the benchmarks of the pull request
        run: cmake --workflow --preset bench
        timeout-minutes: 30

      - name: Split the benchmarks in turn into parts
        id: split
        run: |
          "$HEAD_BENCHMARKS" --benchmark_list_tests | sed 's/[][\.*^$+?(){}|]/\\&/g' | awk -v parts="$PARTS" '{ print > ("part-" (NR - 1) % parts) }'
          echo "filters=$(for part in part-*; do printf '^(%s)$\n' "$(paste -sd '|' "$part")"; done | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
        timeout-minutes: 5

  times:
    name: Compare the times (${{ strategy.job-index }})
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        filter: ${{ fromJSON(needs.plan.outputs.filters) }}
    env:
      FILTER: ${{ matrix.filter }}
      INDEX: ${{ strategy.job-index }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        timeout-minutes: 5

      - name: Build the benchmarks of the pull request and of its base
        run: |
          cmake --workflow --preset bench
          git worktree add ../base "$BASE"
          cd ../base && cmake --workflow --preset bench
        timeout-minutes: 30

      - name: Install the requirements of compare.py
        run: |
          python3 -m venv ../venv
          ../venv/bin/pip install -r build/bench/_deps/benchmark-src/tools/requirements.txt
        timeout-minutes: 10

      - name: Compare the times
        run: |
          mkdir -p report
          "$BASE_BENCHMARKS" --benchmark_filter="$FILTER" --benchmark_repetitions=9 --benchmark_out="report/base-$INDEX.json" --benchmark_out_format=json
          "$HEAD_BENCHMARKS" --benchmark_filter="$FILTER" --benchmark_repetitions=9 --benchmark_out="report/head-$INDEX.json" --benchmark_out_format=json
          ../venv/bin/python build/bench/_deps/benchmark-src/tools/compare.py --no-color -a benchmarks "report/base-$INDEX.json" "report/head-$INDEX.json" > "report/times-$INDEX.txt"
        timeout-minutes: 60

      - name: Upload the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-times-${{ strategy.job-index }}
          path: report
        timeout-minutes: 5

  report:
    name: Report the times
    needs: times
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download the comparisons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-times-*
          path: report
          merge-multiple: true
        timeout-minutes: 5

      - name: Install gnuplot
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot-nox
        timeout-minutes: 10

      - name: Write the report
        run: |
          cat report/times-*.txt > report/times.txt
          { echo '```'; cat report/times.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          awk '$1 ~ /_median$/ { median[substr($1, 1, length($1) - 7)] = $2 * 100 } $1 ~ /_pvalue$/ { pvalue[substr($1, 1, length($1) - 7)] = $2 } END { for (name in median) { color = pvalue[name] >= 0.05 ? 3 : (median[name] > 0 ? 1 : 2); printf "%s\t%.2f\t%d\n", name, median[name], color } }' report/times.txt | sort -t "$(printf '\t')" -k2,2n > report/times.tsv
          gnuplot -e "rows = $(wc -l < report/times.tsv)" - <<'EOF'
          set terminal svg size 960, rows * 13 + 140 font "Helvetica,10" background rgb "white" noenhanced
          set output "report/times.svg"
          set datafile separator "\t"
          set title "Median time change per benchmark, head against base"
          set xlabel "faster <- median time change -> slower (grey band: 3%, red or green: p < 0.05)"
          set xrange [-30:30]
          set yrange [-1:rows]
          set xtics 10 format "%+g%%"
          set grid xtics
          set key off
          set object 1 rectangle from -3, graph 0 to 3, graph 1 fillcolor rgb "#e8e8e8" fillstyle solid noborder behind
          set linetype 1 linecolor rgb "#c0392b"
          set linetype 2 linecolor rgb "#1e8449"
          set linetype 3 linecolor rgb "#999999"
          clamp(x) = x < -30 ? -30 : (x > 30 ? 30 : x)
          plot "report/times.tsv" using (0):0:(clamp($2)):(0):3 with vectors nohead linecolor variable, "" using (clamp($2)):0:3:ytic(1) with points pointtype 7 pointsize 0.6 linecolor variable
          EOF
          { echo '<!doctype html><meta charset="utf-8"><img src="times.svg" style="width: 100%"><pre>'; sed 's/&/\&amp;/g; s/</\&lt;/g' report/times.txt; echo '</pre>'; } > report/times.html
          google-chrome --headless=new --disable-gpu --no-sandbox --no-pdf-header-footer --print-to-pdf=report/times.pdf "file://$PWD/report/times.html" 2> /dev/null
        timeout-minutes: 10

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-times
          path: report
        timeout-minutes: 5
