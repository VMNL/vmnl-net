# Builds the documentation on every pull request and publishes it on GitHub Pages from main.
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

env:
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_AWESOME_VERSION: 2.5.0

jobs:
  build:
    name: Generate the documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          curl -fsSL "https://www.doxygen.nl/files/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Fetch doxygen-awesome-css ${{ env.DOXYGEN_AWESOME_VERSION }}
        run: mkdir theme && curl -fsSL "https://github.com/jothepro/doxygen-awesome-css/archive/refs/tags/v$DOXYGEN_AWESOME_VERSION.tar.gz" | tar -xz -C theme --strip-components=1
        timeout-minutes: 5

      - name: Generate the documentation
        env:
          DOXYGEN_THEME: theme/doxygen-awesome.css theme/doxygen-awesome-sidebar-only.css
        run: cmake -B build -DVMNL_NET_BUILD_DOCS=ON -DVMNL_NET_BUILD_TESTS=OFF && cmake --build build --target docs
        timeout-minutes: 5

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs/html
        timeout-minutes: 5

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        timeout-minutes: 10
